# Provisions both VMs from a fresh Ubuntu 22.04 install (see README for the manual prerequisites).
# Run from ansible/: ansible-playbook site.yml --ask-become-pass
- name: Base setup (Docker)
  hosts: all
  become: true
  roles:
    - common

- name: Kubernetes node (minikube)
  hosts: k8s
  become: true
  roles:
    - minikube

- name: Application on Kubernetes
  hosts: k8s
  become: true
  roles:
    - k8s_app
    - ingress_proxy

- name: Monitoring node (Prometheus, Loki, Grafana)
  hosts: monitoring
  become: true
  roles:
    - observability
