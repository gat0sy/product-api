# Docker Engine from Docker's apt repository, same layout as Docker's install docs
- name: Install apt prerequisites
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Docker's signing key
  ansible.builtin.shell: >
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg
    | gpg --dearmor -o {{ docker_keyring }}
  args:
    creates: "{{ docker_keyring }}"

- name: Make Docker's signing key readable by apt
  ansible.builtin.file:
    path: "{{ docker_keyring }}"
    mode: "0644"

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64 signed-by={{ docker_keyring }}]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    filename: docker
    state: present

- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true

- name: Start Docker and enable it at boot
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true

- name: Let {{ app_user }} use Docker without sudo
  ansible.builtin.user:
    name: "{{ app_user }}"
    groups: docker
    append: true
