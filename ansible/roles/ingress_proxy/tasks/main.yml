- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Read minikube IP
  ansible.builtin.command: minikube ip
  become: true
  become_user: "{{ app_user }}"
  register: minikube_ip_cmd
  changed_when: false
  check_mode: false

- name: Install product-api site
  ansible.builtin.template:
    src: product-api.nginx.j2
    dest: /etc/nginx/sites-available/product-api
    mode: "0644"
  vars:
    minikube_ip: "{{ minikube_ip_cmd.stdout | trim }}"
  notify: Reload nginx

- name: Enable product-api site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/product-api
    dest: /etc/nginx/sites-enabled/product-api
    state: link
  notify: Reload nginx

# The default site also listens on port 80 and would compete with ours
- name: Disable default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Start nginx and enable it at boot
  ansible.builtin.systemd_service:
    name: nginx
    state: started
    enabled: true
